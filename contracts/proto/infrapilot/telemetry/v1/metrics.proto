syntax = "proto3";

package infrapilot.telemetry.v1;

import "google/protobuf/timestamp.proto";

// MetricsSample holds one metric data point. The verified tenant is carried by the envelope.
message MetricsSample {
  string project_id = 1;
  string resource_id = 2;
  string metric_name = 3;
  string series_id = 4;
  string sample_id = 5;
  google.protobuf.Timestamp observed_at = 6;
  // A serialized OTLP ResourceMetrics with one scope, metric and data point.
  bytes otlp_payload = 7;
  oneof value {
    int64 int_value = 8;
    double double_value = 9;
  }
}
