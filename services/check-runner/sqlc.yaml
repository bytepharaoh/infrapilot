# sqlc configuration (ADR-0008): SQL in internal/store/queries, schema from the goose migrations.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_methods_with_db_argument: false
        emit_result_struct_pointers: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: int2
            nullable: true
            go_type:
              type: int16
              pointer: true
          - db_type: float8
            nullable: true
            go_type:
              type: float64
              pointer: true
